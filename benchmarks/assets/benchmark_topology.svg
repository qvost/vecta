<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc"><title id="title">Binary footprint dissection</title><desc id="desc">bash 1,195 KiB to zsh 971 KiB. Reported net file reduction 223.3 KiB (18.7%). BSS is zero-initialized runtime storage, not file bytes.</desc><rect width="1800" height="900" fill="white"/><g font-family="Times New Roman, Liberation Serif, serif" fill="black" font-size="30">
